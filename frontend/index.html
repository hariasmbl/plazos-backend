<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Consultor de RUT - BL Capital</title>
  <script src="https://cdn.tailwindcss.com"></script>
  
  <script>
    function normalizarRut(rut) {
      return rut.replace(/\./g, "").replace(/\s+/g, "").replace(/-k$/i, "-K").toUpperCase();
    }
  </script>
</head>

<body class="bg-white text-gray-800 font-sans">
  <header class="bg-blue-900 text-white shadow">
    <div class="max-w-6xl mx-auto flex justify-between items-center p-4">
      <img src="assets/logo.png" alt="BL Capital" class="h-10">
      <h1 class="text-xl font-semibold">Consultor de Plazos de Pago</h1>
    </div>
  </header>

  <main class="max-w-4xl mx-auto mt-10 p-4">
    <div id="authSection" class="text-center">
      <p class="text-lg mb-4">Accede con tu cuenta corporativa @blcapital.cl</p>
      <button id="loginBtn" class="bg-blue-600 text-white px-6 py-2 rounded hover:bg-blue-700">Iniciar sesión con Google</button>
    </div>

    <div id="appContent" class="hidden">
      <div class="flex justify-end gap-2 mb-4">
        <button id="adminBtn" onclick="window.open('admin.html', '_blank')" class="hidden bg-blue-100 text-blue-800 px-3 py-1 text-sm rounded hover:bg-blue-200">Panel de carga</button>
        <button id="logoutBtn" class="bg-gray-300 px-3 py-1 text-sm rounded hover:bg-gray-400">Cerrar sesión</button>
      </div>

      <div class="flex gap-2 mb-6 border-b">
        <button id="modoIndividualBtn" onclick="cambiarModo('individual')" class="px-4 py-2 text-sm font-medium border-b-2 border-blue-700 text-blue-700">Consulta individual</button>
        <button id="modoMultipleBtn" onclick="cambiarModo('multiple')" class="px-4 py-2 text-sm font-medium border-b-2 border-transparent text-gray-500 hover:text-gray-700">Consulta múltiple</button>
      </div>

      <div id="seccionIndividual">
        <form id="consultaForm" class="flex gap-4 mb-6">
          <input type="text" id="rut" placeholder="Ingrese RUT del deudor (Ejemplo: 12345678-9)" required class="border rounded px-4 py-2 flex-1">
          <button type="submit" class="bg-blue-700 text-white px-6 py-2 rounded hover:bg-blue-800">Consultar</button>
        </form>

        <!-- input oculto para factorDias (CAMBIO #1) -->
        <input type="hidden" id="factorDias" value="15">

        <div id="resultados" class="space-y-6"></div>

        <div class="mt-4">
          <button onclick="limpiarResultados()" class="text-sm text-gray-600 underline hover:text-gray-800">Limpiar resultados</button>
        </div>
      </div>

      <div id="seccionMultiple" class="hidden">
        <div class="mb-4 flex gap-4">
          <label class="inline-flex items-center">
            <input type="radio" name="fuenteRuts" value="pegar" checked onchange="cambiarFuenteRuts('pegar')">
            <span class="ml-1 text-sm">Pegar lista de RUTs</span>
          </label>
          <label class="inline-flex items-center">
            <input type="radio" name="fuenteRuts" value="archivo" onchange="cambiarFuenteRuts('archivo')">
            <span class="ml-1 text-sm">Subir Excel/CSV</span>
          </label>
        </div>

        <div id="pegarRutsSection">
          <textarea id="rutsTextarea" rows="4" placeholder="Ingresa los RUTs separados por coma o salto de línea (máx. 50)" class="border rounded px-3 py-2 w-full"></textarea>
        </div>

        <div id="archivoRutsSection" class="hidden">
          <input type="file" id="archivoRuts" accept=".xlsx,.xls,.csv" class="border rounded px-2 py-1 text-sm">
          <p class="text-xs text-gray-500 mt-1">Se busca una columna llamada "RUT"; si no existe, se usa la primera columna del archivo.</p>
        </div>

        <div class="mt-4">
          <button onclick="consultarBatch()" class="bg-blue-700 text-white px-6 py-2 rounded hover:bg-blue-800">Consultar</button>
        </div>

        <p id="msgBatch" class="text-sm mt-2"></p>

        <div id="resultadosBatch" class="mt-6"></div>
      </div>
    </div>
  </main>

  <footer class="bg-gray-100 text-center text-sm py-4 text-gray-600">
    &copy; 2025 BL Capital. Todos los derechos reservados.
  </footer>

  <!-- ========================================================== -->
  <!-- LÓGICA DEL CONSULTOR -->
  <!-- ========================================================== -->
  <script>
    let simulacionAprobada = false;

    document.getElementById('consultaForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      const rawRut = document.getElementById('rut').value.trim();
      const rut = normalizarRut(rawRut);

      const res = await fetch(`https://plazos-backend.onrender.com/consultar-rut?rut=${rut}`, {
        method: "GET",
        mode: "cors"
      });

      const data = await res.json();

      // 🔹 CAMBIO #2 — guardar factor que viene desde backend
      if ("factor_dias" in data) {
        document.getElementById("factorDias").value = data.factor_dias;
      }

      mostrarResultados(data, rut);
    });

    function mostrarResultados(data, rut) {
      const div = document.getElementById('resultados');
      div.innerHTML = '';

      if (data.error) {
        div.innerHTML = `<p class="text-red-600 font-semibold">${data.error}</p>`;
        return;
      }

      const f = formatFecha;
      const nombre = data.nombre_deudor || "Sin nombre";

      let html = `
        <h2 class="text-xl font-bold text-blue-800 mb-4">Deudor: ${nombre}</h2>
      `;

      if (data.riesgo_detectado) {
        html += `
          <section class="bg-yellow-100 border border-yellow-400 text-yellow-800 px-4 py-3 rounded mb-4">
            <p>Revisar el plazo y anticipo con RIESGO. Hay documentos morosos cuyo plazo desde la emisión supera lo recomendado (${data.plazo_recomendado} días).</p>
            <button onclick="window.print()" class="mt-2 bg-green-600 text-white px-4 py-1 rounded hover:bg-green-700">
              Guardar como PDF
            </button>          
          </section>`;
      }

      if (!data.recomendacion.toLowerCase().includes("riesgo")) {

        // 🔹 CAMBIO #3 — pasar factorDias al botón del simulador
        html += `
          <section class="mt-6">
            <h2 class="text-lg font-semibold text-blue-800 mb-2">¿Desea revisar plazo y anticipo?</h2>
            <div class="flex items-end gap-4 mb-4">
              <div>
                <label for="plazo" class="block text-sm font-medium">Plazo (días):</label>
                <input type="number" id="plazo" class="border px-2 py-1 w-24" min="1">
              </div>
              <div>
                <label for="anticipo" class="block text-sm font-medium">% Anticipo:</label>
                <input type="number" id="anticipo" class="border px-2 py-1 w-24" min="0" max="100">
              </div>

              <button onclick="simular(${data.plazo_recomendado}, ${data.factor_dias || 15})"
                class="bg-yellow-500 text-white px-4 py-2 rounded hover:bg-yellow-600">
                Simular
              </button>

              <button id="confirmarBtn" onclick="confirmarSimulacion()"
                class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700" disabled>
                Confirmar
              </button>
            </div>
            <div id="evaluacionResultado" class="mt-4 text-sm font-semibold"></div>
          </section>`;
      }

      // ==========================================================
      // RESTO DEL CÓDIGO — TABLAS, LISTADOS, TODO IGUAL
      // ==========================================================

      // Últimos pagos
      const ultimos = Array.isArray(data.ultimos_pagos)
        ? data.ultimos_pagos
        : [];

      if (ultimos.length > 0) {
        const ultimosPagos = ultimos.map(p => `
          <tr class="border-t">
            <td class="px-3 py-2 text-center">${(p.monto || 0).toLocaleString()}</td>
            <td class="px-3 py-2 text-center">${f(p.fecha_ces)}</td>
            <td class="px-3 py-2 text-center">${f(p.fecha_emision)}</td>
            <td class="px-3 py-2 text-center">${f(p.fecha_pago)}</td>
            <td class="px-3 py-2 text-center">${p.plazo ?? 'N/A'}</td>
          </tr>`).join('');

        html += `
          <section>
            <h2 class="text-lg font-semibold text-blue-800 mt-8 mb-2">Últimos Pagos</h2>
            <table class="w-full border">
              <thead class="bg-gray-100">
                <tr>
                  <th>Monto Factura</th>
                  <th>Fecha Compra</th>
                  <th>Fecha Emisión</th>
                  <th>Fecha Pago</th>
                  <th>Plazo (Días)</th>
                </tr>
              </thead>
              <tbody>${ultimosPagos}</tbody>
            </table>
            <div class="flex justify-between items-center mt-2">
              <p>
                Promedio últimos 5 pagos:
                <strong>${data.promedio_ultimos !== undefined ? data.promedio_ultimos.toFixed(2) : "Sin datos"} días</strong>
              </p>
              <button onclick="verPagosHistoricos('${rut}')" class="text-sm bg-gray-200 px-3 py-1 rounded hover:bg-gray-300">
                Ver pagos históricos
              </button>
            </div>
          </section>`;
      }

      // ==========================
      // Histórico SOLO si hay datos
      // ==========================
      if (data.cantidad_historico && data.cantidad_historico > 0) {
        html += `
          <section>
            <h2 class="text-lg font-semibold text-blue-800 mt-8 mb-2">Promedio Histórico</h2>
            <p>Pagos considerados: <strong>${data.cantidad_historico}</strong></p>
            <p>Promedio: <strong>${data.promedio_historico.toFixed(2)} días</strong></p>
            <p>Desviación estándar: <strong>${data.desviacion_estandar.toFixed(2)}</strong></p>
          </section>
        `;
      }

      // ==========================
      // Factura más lenta SOLO si existe
      // ==========================
      if (data.factura_mas_lenta) {
        html += `
          <section>
            <h2 class="text-lg font-semibold text-blue-800 mt-8 mb-2">Factura mayor plazo de pago</h2>
            <p>Monto: ${(data.factura_mas_lenta.monto || 0).toLocaleString()}</p>
            <p>Compra: ${f(data.factura_mas_lenta.fecha_ces)}</p>
            <p>Emisión: ${f(data.factura_mas_lenta.fecha_emision)}</p>
            <p>Pago: ${f(data.factura_mas_lenta.fecha_pago)}</p>
            <p><strong>${data.factura_mas_lenta.plazo} días</strong></p>
          </section>
        `;
      } else {
        html += `
          <section>
            <h2 class="text-lg font-semibold text-blue-800 mt-8 mb-2">Factura mayor plazo de pago</h2>
            <p>No existen facturas registradas para este deudor.</p>
          </section>
        `;
      }

      // Morosos
      const mor = Array.isArray(data.morosos)
        ? data.morosos
        : [];

      if (mor.length > 0) {
        const morosos = mor.map(m => `
          <tr class="border-t">
            <td class="px-3 py-2 text-center">${(m.monto || 0).toLocaleString()}</td>
            <td class="px-3 py-2 text-center">${m.saldo.toLocaleString()}</td>
            <td class="px-3 py-2 text-center">${f(m.fecha_ces)}</td>
            <td class="px-3 py-2 text-center">${f(m.fecha_emision)}</td>
            <td class="px-3 py-2 text-center">${m.dias_vencido}</td>
            <td class="px-3 py-2 text-center">${m.dias_mora ?? "N/A"}</td>
          </tr>`).join('');

        html += `
          <section>
            <h2 class="text-lg font-semibold text-blue-800 mt-8 mb-2">Facturas Morosas</h2>
            <table class="w-full border border-gray-300 text-sm text-center">
              <thead class="bg-gray-100 text-blue-900 font-semibold">
                <tr>
                  <th>Monto</th>
                  <th>Saldo</th>
                  <th>Compra</th>
                  <th>Emisión</th>
                  <th>Días desde emisión</th>
                  <th>Días mora</th>
                </tr>
              </thead>
              <tbody>${morosos}</tbody>
            </table>
          </section>`;
      }

      // ==========================================================
      // Empresas Similares (cuando no hay historial del deudor)
      // ==========================================================
      if (data.empresas_similares) {

        html += `
          <section class="bg-blue-50 border border-blue-300 p-4 rounded mt-6">
            <h2 class="text-lg font-semibold text-blue-900 mb-2">
              Datos de Empresas Similares
            </h2>

            <p><strong>Rubro:</strong> ${data.rubro || "N/A"}</p>
            <p><strong>Tramo según ventas:</strong> ${data.tramo || "N/A"}</p>

            <p class="mt-2">
              Promedio de pago empresas similares:
              <strong>${data.promedio_empresas_similares ? Math.round(data.promedio_empresas_similares) : "N/A"} días</strong>
            </p>

            <p>
              Desviación estándar:
              <strong>${data.desviacion_empresas_similares ? Math.round(data.desviacion_empresas_similares) : "N/A"}</strong>
            </p>

            <p>
              Cantidad de pagos considerados:
              <strong>${data.cantidad_empresas_similares || 0}</strong>
            </p>
          </section>
        `;
      }


      div.innerHTML = html;
    }

    // ==========================================================
    // FUNCIÓN SIMULAR — ya incluye factor personalizado
    // ==========================================================
    const PLAZO_MIN_DIAS = 30;
    const PLAZO_MAX_DIAS = 100;

    function simular(plazoRecomendado, factorDias = 15) {
      const plazo = parseInt(document.getElementById('plazo').value);
      const anticipo = parseFloat(document.getElementById('anticipo').value);
      const resultado = document.getElementById('evaluacionResultado');
      const confirmarBtn = document.getElementById('confirmarBtn');

      if (isNaN(plazo) || isNaN(anticipo)) {
        alert("Por favor ingrese valores válidos para plazo y anticipo.");
        return;
      }

      confirmarBtn.disabled = false;

      // Cota de días de plazo, independiente del anticipo
      if (plazo < PLAZO_MIN_DIAS) {
        simulacionAprobada = false;
        resultado.innerHTML = `
          <p class="text-yellow-700">⚠️ Plazo menor a ${PLAZO_MIN_DIAS} días: debe ser revisado por Riesgo.</p>`;
        return;
      }

      if (plazo > PLAZO_MAX_DIAS) {
        simulacionAprobada = false;
        resultado.innerHTML = `
          <p class="text-yellow-700">⚠️ Plazo superior a ${PLAZO_MAX_DIAS} días: debe ser revisado por Riesgo.</p>`;
        return;
      }

      const puntos_anticipo = 100 - anticipo;
      const dias_extra = puntos_anticipo * factorDias;
      const total = Math.floor(plazo + dias_extra);

      simulacionAprobada = total >= plazoRecomendado;

      resultado.innerHTML = `<p>Estás simulando <strong>${total}</strong> días entre plazo y anticipo.</p>`;

      if (simulacionAprobada) {
        resultado.innerHTML += `
          <p class="text-green-700">✅ Aprobado: el total (${total}) cubre o supera lo recomendado (${plazoRecomendado}).</p>`;
      } else {
        resultado.innerHTML += `
          <p class="text-red-600">⚠️ Rechazado: El total (${total}) no alcanza lo recomendado (${plazoRecomendado}). Revise con riesgo.</p>`;
      }
    }

    function confirmarSimulacion() {
      document.getElementById('plazo').disabled = true;
      document.getElementById('anticipo').disabled = true;
      document.getElementById('confirmarBtn').disabled = true;

      const resultado = document.getElementById('evaluacionResultado');
      resultado.innerHTML += `
        <button onclick="window.print()" class="mt-2 bg-green-600 text-white px-4 py-1 rounded hover:bg-green-700">
          Guardar como PDF
        </button>`;
    }

    function formatFecha(fechaStr) {
      if (!fechaStr) return 'N/A';
      const fecha = new Date(fechaStr);
      const d = String(fecha.getDate()).padStart(2, '0');
      const m = String(fecha.getMonth() + 1).padStart(2, '0');
      const y = fecha.getFullYear();
      return `${d}-${m}-${y}`;
    }

    function verPagosHistoricos(rut) {
      window.open(`historico.html?rut=${encodeURIComponent(rut)}`, '_blank');
    }

    function limpiarResultados() {
      document.getElementById("resultados").innerHTML = "";
    }

    // ==========================================================
    // CONSULTA MÚLTIPLE (batch)
    // ==========================================================
    const LIMITE_BATCH_RUTS = 50;
    let ultimosResultadosBatch = [];

    function cambiarModo(modo) {
      const activo = "border-blue-700 text-blue-700";
      const inactivo = "border-transparent text-gray-500 hover:text-gray-700";

      document.getElementById('seccionIndividual').classList.toggle('hidden', modo !== 'individual');
      document.getElementById('seccionMultiple').classList.toggle('hidden', modo !== 'multiple');

      const btnIndividual = document.getElementById('modoIndividualBtn');
      const btnMultiple = document.getElementById('modoMultipleBtn');
      btnIndividual.className = `px-4 py-2 text-sm font-medium border-b-2 ${modo === 'individual' ? activo : inactivo}`;
      btnMultiple.className = `px-4 py-2 text-sm font-medium border-b-2 ${modo === 'multiple' ? activo : inactivo}`;
    }

    function cambiarFuenteRuts(fuente) {
      document.getElementById('pegarRutsSection').classList.toggle('hidden', fuente !== 'pegar');
      document.getElementById('archivoRutsSection').classList.toggle('hidden', fuente !== 'archivo');
    }

    async function obtenerListaRuts() {
      const fuente = document.querySelector('input[name="fuenteRuts"]:checked').value;

      if (fuente === 'pegar') {
        const texto = document.getElementById('rutsTextarea').value;
        return texto.split(/[\n,]+/).map(r => r.trim()).filter(Boolean);
      }

      const input = document.getElementById('archivoRuts');
      if (!input.files.length) {
        throw new Error("Selecciona un archivo primero.");
      }

      const formData = new FormData();
      formData.append("file", input.files[0]);

      const res = await fetch("https://plazos-backend.onrender.com/extraer-ruts", {
        method: "POST",
        body: formData
      });
      const data = await res.json();

      if (!res.ok) {
        throw new Error(data.error || "No se pudo leer el archivo.");
      }

      return data.ruts;
    }

    async function consultarBatch() {
      const msg = document.getElementById('msgBatch');
      document.getElementById('resultadosBatch').innerHTML = "";
      msg.textContent = "";

      let listaRuts;
      try {
        listaRuts = await obtenerListaRuts();
      } catch (e) {
        msg.textContent = e.message;
        msg.className = "text-sm mt-2 text-red-600";
        return;
      }

      const ruts = [...new Set(listaRuts.map(normalizarRut).filter(Boolean))];

      if (ruts.length === 0) {
        msg.textContent = "No se encontraron RUTs válidos.";
        msg.className = "text-sm mt-2 text-red-600";
        return;
      }

      if (ruts.length > LIMITE_BATCH_RUTS) {
        msg.textContent = `Máximo ${LIMITE_BATCH_RUTS} RUTs por consulta (tienes ${ruts.length}).`;
        msg.className = "text-sm mt-2 text-red-600";
        return;
      }

      msg.textContent = `Consultando ${ruts.length} RUT(s)...`;
      msg.className = "text-sm mt-2 text-gray-600";

      try {
        const res = await fetch("https://plazos-backend.onrender.com/consultar-ruts-batch", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ ruts })
        });
        const data = await res.json();

        if (!res.ok) {
          msg.textContent = data.error || "Error al consultar.";
          msg.className = "text-sm mt-2 text-red-600";
          return;
        }

        ultimosResultadosBatch = data.resultados;
        msg.textContent = `${data.resultados.length} resultado(s).`;
        msg.className = "text-sm mt-2 text-green-700";
        mostrarTablaBatch(data.resultados);
      } catch (e) {
        msg.textContent = "Error al consultar: " + e.message;
        msg.className = "text-sm mt-2 text-red-600";
      }
    }

    function mostrarTablaBatch(resultados) {
      const contenedor = document.getElementById('resultadosBatch');

      const filas = resultados.map(r => {
        if (r.error) {
          return `
            <tr class="border-t">
              <td class="px-3 py-2">${r.rut}</td>
              <td class="px-3 py-2 text-red-600" colspan="6">${r.error}</td>
            </tr>`;
        }
        return `
          <tr class="border-t">
            <td class="px-3 py-2">${r.rut}</td>
            <td class="px-3 py-2">${r.nombre_deudor || 'N/A'}</td>
            <td class="px-3 py-2 text-center">${r.tipo_entidad || 'N/A'}</td>
            <td class="px-3 py-2 text-center">${r.plazo_recomendado ?? 'N/A'}</td>
            <td class="px-3 py-2 text-center">${r.promedio_historico !== undefined && r.promedio_historico !== null ? r.promedio_historico.toFixed(1) : 'N/A'}</td>
            <td class="px-3 py-2 text-center">${r.cantidad_historico ?? 0}</td>
            <td class="px-3 py-2 text-center">${r.riesgo_detectado ? '⚠️ Sí' : 'No'}</td>
          </tr>`;
      }).join('');

      contenedor.innerHTML = `
        <div class="flex justify-end gap-2 mb-2">
          <button onclick="descargarCSVBatch()" class="text-sm bg-gray-200 px-3 py-1 rounded hover:bg-gray-300">Descargar CSV</button>
          <button onclick="window.print()" class="text-sm bg-gray-200 px-3 py-1 rounded hover:bg-gray-300">Imprimir</button>
        </div>
        <table class="w-full border text-sm">
          <thead class="bg-gray-100">
            <tr>
              <th class="px-3 py-2 text-left">RUT</th>
              <th class="px-3 py-2 text-left">Deudor</th>
              <th class="px-3 py-2">Tipo</th>
              <th class="px-3 py-2">Plazo recomendado</th>
              <th class="px-3 py-2">Promedio histórico</th>
              <th class="px-3 py-2">Cant. histórico</th>
              <th class="px-3 py-2">¿Riesgo?</th>
            </tr>
          </thead>
          <tbody>${filas}</tbody>
        </table>`;
    }

    function descargarCSVBatch() {
      const encabezado = ["RUT", "Deudor", "Tipo", "Plazo recomendado", "Promedio historico", "Cantidad historico", "Riesgo", "Error"];
      const filas = ultimosResultadosBatch.map(r => [
        r.rut,
        r.error ? "" : (r.nombre_deudor || ""),
        r.error ? "" : (r.tipo_entidad || ""),
        r.error ? "" : (r.plazo_recomendado ?? ""),
        r.error ? "" : (r.promedio_historico ?? ""),
        r.error ? "" : (r.cantidad_historico ?? ""),
        r.error ? "" : (r.riesgo_detectado ? "Si" : "No"),
        r.error || ""
      ]);

      const csv = [encabezado, ...filas]
        .map(fila => fila.map(v => `"${String(v).replace(/"/g, '""')}"`).join(","))
        .join("\n");

      const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `consulta_ruts_${new Date().toISOString().slice(0, 10)}.csv`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }
  </script>
  
  <script type="module">
  document.addEventListener("DOMContentLoaded", async () => {

    const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js");
    const { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } =
      await import("https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js");

    const firebaseConfig = {
      apiKey: "AIzaSyAUtJoJRUGDwpGhLXr-0WhGvtKlr0YwNWY",
      authDomain: "plazos-bl.firebaseapp.com",
      projectId: "plazos-bl",
      storageBucket: "plazos-bl.firebasestorage.app",
      messagingSenderId: "39828725985",
      appId: "1:39828725985:web:f414fa57db531758d397a0"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    const loginBtn = document.getElementById("loginBtn");
    const logoutBtn = document.getElementById("logoutBtn");
    const adminBtn = document.getElementById("adminBtn");
    const authSection = document.getElementById("authSection");
    const appContent = document.getElementById("appContent");

    async function esAdmin(email) {
      try {
        const res = await fetch("admins.txt");
        const texto = await res.text();
        const admins = texto.split("\n").map(l => l.trim().toLowerCase()).filter(Boolean);
        return admins.includes(email.toLowerCase());
      } catch (e) {
        console.error("No se pudo verificar la lista de admins:", e);
        return false;
      }
    }

    // --- EVENTOS ---
    loginBtn?.addEventListener("click", () => {
      signInWithPopup(auth, provider).catch((error) => {
        alert("Error al iniciar sesión: " + error.message);
      });
    });

    logoutBtn?.addEventListener("click", () => {
      signOut(auth);
    });

    // --- AUTH ---
    onAuthStateChanged(auth, async (user) => {
      if (user && user.email.endsWith("@blcapital.cl")) {
        authSection.classList.add("hidden");
        appContent.classList.remove("hidden");
        adminBtn.classList.toggle("hidden", !(await esAdmin(user.email)));
      } else {
        authSection.classList.remove("hidden");
        appContent.classList.add("hidden");
        adminBtn.classList.add("hidden");
      }
    });

  });
  </script>

  </body>
</html>
